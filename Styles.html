<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --border: #e5e7eb;
    --primary: #1e3a5f; --primary-2: #2c5282; --accent: #d97706;
    --green: #16a34a; --green-bg: #dcfce7; --red: #dc2626; --red-bg: #fee2e2;
    --amber: #b45309; --amber-bg: #fef3c7; --blue: #2563eb; --blue-bg: #dbeafe; --gray-bg: #f3f4f6;
    --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; }
  a { color: var(--primary-2); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .right { text-align: right; } .nowrap { white-space: nowrap; }
  .row { display: flex; align-items: center; } .wrap { flex-wrap: wrap; } .gap-s { gap: 8px; } .gap { gap: 14px; }
  .between { justify-content: space-between; } .grow { flex: 1; }

  /* Login */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1e3a5f, #2c5282 60%, #d97706); padding: 16px; }
  .login-card { background: #fff; padding: 32px; border-radius: 14px; width: 100%; max-width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .login-card h2 { margin: 6px 0 2px; } .brand-big { font-size: 40px; }

  /* Shell */
  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: 230px; background: var(--primary); color: #fff; display: flex; flex-direction: column; position: fixed; inset: 0 auto 0 0; z-index: 30; transition: transform .2s; }
  .brand { display: flex; gap: 10px; align-items: center; padding: 18px 16px; font-weight: 700; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,.1); }
  #nav { flex: 1; padding: 10px 8px; overflow-y: auto; }
  #nav a { display: flex; gap: 10px; align-items: center; color: #cbd5e1; padding: 9px 12px; border-radius: 8px; margin-bottom: 2px; text-decoration: none; }
  #nav a:hover { background: rgba(255,255,255,.08); color: #fff; }
  #nav a.active { background: rgba(255,255,255,.15); color: #fff; font-weight: 600; }
  #nav .sep { font-size: 11px; text-transform: uppercase; color: #94a3b8; padding: 12px 12px 4px; letter-spacing: .5px; }
  .side-foot { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.1); }
  .side-foot .muted { color: #94a3b8; } .me { font-weight: 600; }
  .side-foot .btn.ghost { color: #e2e8f0; border-color: rgba(255,255,255,.25); }
  .main { flex: 1; margin-left: 230px; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .topbar h1 { font-size: 19px; margin: 0; flex: 1; }
  .menu-btn { display: none; }
  .page { padding: 22px 24px 60px; }

  /* Cards & grid */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 18px; }
  .card h3 { margin: 0 0 12px; font-size: 15px; }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .stat { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .stat .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  .stat .val { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .stat .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .bar { height: 8px; background: var(--gray-bg); border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; background: var(--accent); }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; }
  table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--border); background: #fafbfc; white-space: nowrap; }
  table.t td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.t tr:hover td { background: #fafbfd; }
  table.t tfoot td { font-weight: 700; background: #fafbfc; }
  .empty { text-align: center; color: var(--muted); padding: 28px !important; }

  /* Badges */
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; text-transform: capitalize; white-space: nowrap; }
  .b-green { background: var(--green-bg); color: var(--green); } .b-red { background: var(--red-bg); color: var(--red); }
  .b-amber { background: var(--amber-bg); color: var(--amber); } .b-blue { background: var(--blue-bg); color: var(--blue); }
  .b-gray { background: var(--gray-bg); color: #4b5563; }

  /* Buttons & forms */
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: #fff; color: var(--text);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .btn:hover { background: #f9fafb; } .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; } .btn.primary:hover { background: var(--primary-2); }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.success { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.danger { color: var(--red); border-color: #fecaca; } .btn.danger:hover { background: var(--red-bg); }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 5px 10px; font-size: 12px; } .btn.block { width: 100%; justify-content: center; margin-top: 8px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 12px; }
  input, select, textarea { width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; color: var(--text); }
  input:focus, select:focus, textarea:focus { outline: 2px solid #93c5fd; border-color: #60a5fa; }
  textarea { min-height: 70px; resize: vertical; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
  .filters label { margin: 0; min-width: 150px; }
  .alert { padding: 10px 12px; border-radius: 8px; margin: 8px 0; font-size: 13px; }
  .alert.error { background: var(--red-bg); color: var(--red); } .alert.info { background: var(--blue-bg); color: #1e40af; }
  .alert.warn { background: var(--amber-bg); color: var(--amber); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; flex-wrap: wrap; }
  .tabs a { padding: 9px 14px; color: var(--muted); border-bottom: 2px solid transparent; text-decoration: none; }
  .tabs a.active { color: var(--primary); border-color: var(--primary); font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 7px 12px; cursor: pointer; } .seg button.on { background: var(--primary); color: #fff; }
  dl.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; margin: 0; } dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; font-weight: 500; }

  /* Room board */
  .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .room { background: #fff; border: 1px solid var(--border); border-left: 5px solid var(--green); border-radius: 10px; padding: 12px; cursor: pointer; box-shadow: var(--shadow); }
  .room:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .room.occupied { border-left-color: var(--red); } .room.maintenance { border-left-color: #6b7280; } .room.cleaning { border-left-color: var(--accent); }
  .room .no { font-size: 20px; font-weight: 700; }

  /* Modal / toast / loader */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 40px 12px; overflow-y: auto; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 640px; box-shadow: 0 25px 50px rgba(0,0,0,.25); }
  .modal.wide { max-width: 860px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { margin: 0; font-size: 16px; }
  #modal-body { padding: 18px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #111827; color: #fff; padding: 12px 18px; border-radius: 10px; z-index: 70; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,.2); }
  .toast.err { background: var(--red); }
  .loader { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 80; background: transparent; }
  .loader .spinner { height: 3px; width: 40%; background: var(--accent); animation: slide 1s infinite ease-in-out; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .items-table input, .items-table select { margin: 0; padding: 6px 8px; }
  .totals-box { margin-left: auto; max-width: 340px; } .totals-box .row { justify-content: space-between; padding: 4px 0; }
  .totals-box .grand { font-size: 17px; font-weight: 700; border-top: 2px solid var(--primary); margin-top: 6px; padding-top: 8px; color: var(--primary); }
  .feed { list-style: none; margin: 0; padding: 0; } .feed li { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }

  @media (max-width: 1000px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 760px) {
    .sidebar { transform: translateX(-100%); } .sidebar.open { transform: none; }
    .main { margin-left: 0; } .menu-btn { display: inline-flex; }
    .g2, .g3, .g4 { grid-template-columns: minmax(0, 1fr); }
    .page { padding: 16px; } .topbar { padding: 12px 16px; } .topbar h1 { font-size: 17px; }
    dl.kv { grid-template-columns: 110px 1fr; }
  }
  @media (max-width: 480px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
</style>
