<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --border: #e5e7eb;
    --primary: #0f2747; --primary-2: #1e3a5f; --accent: #c9a227; --gold: #c9a227; --gold-soft: rgba(201,162,39,.18);
    --green: #16a34a; --green-bg: #dcfce7; --red: #dc2626; --red-bg: #fee2e2;
    --amber: #b45309; --amber-bg: #fef3c7; --blue: #2563eb; --blue-bg: #dbeafe; --gray-bg: #f3f4f6;
    --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; }
  a { color: var(--primary-2); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .right { text-align: right; } .nowrap { white-space: nowrap; }
  .row { display: flex; align-items: center; } .wrap { flex-wrap: wrap; } .gap-s { gap: 8px; } .gap { gap: 14px; }
  .between { justify-content: space-between; } .grow { flex: 1; }

  /* Login */
  .login-wrap { position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 16px;
    background: linear-gradient(135deg, #0b1f3a, #1e3a5f); }
  .login-bg span { position: absolute; border-radius: 50%; background: rgba(255,255,255,.04); animation: float 14s ease-in-out infinite; }
  .login-bg span:nth-child(1) { width: 340px; height: 340px; top: -90px; left: -80px; }
  .login-bg span:nth-child(2) { width: 220px; height: 220px; bottom: -60px; right: 8%; animation-delay: -4s; }
  .login-bg span:nth-child(3) { width: 120px; height: 120px; top: 18%; right: 22%; animation-delay: -8s; background: rgba(255,255,255,.06); }
  .login-bg span:nth-child(4) { width: 70px; height: 70px; bottom: 20%; left: 18%; animation-delay: -2s; background: rgba(255,255,255,.07); }
  @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(24px,-30px) scale(1.06); } }
  .login-panel { position: relative; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); width: 100%; max-width: 900px; border-radius: 20px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.35); animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.98); } to { opacity: 1; transform: none; } }
  .login-hero { background: #0f2747; color: #fff; padding: 44px 38px; display: flex; flex-direction: column;
    border-right: 1px solid rgba(201,162,39,.25); }
  .login-hero h1 { margin: 0 0 6px; font-size: 40px !important; font-family: Georgia, "Times New Roman", serif; font-size: 34px; letter-spacing: .5px; color: #fff; }
  .tagline { margin: 0 0 26px; color: var(--gold); letter-spacing: 2px; font-size: 13px; text-transform: uppercase; }
  .hero-logo { width: 96px; height: 96px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.2)); }
  .hero-points { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  .hero-points li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.06); transition: background .2s, transform .2s; }
  .hero-points li:hover { background: rgba(201,162,39,.16); transform: translateX(4px); }
  .hero-points li span { font-size: 18px; }
  .hero-foot { margin-top: auto; padding-top: 26px; font-size: 12px; color: #94a3b8; }
  .login-card { background: #fff; padding: 44px 38px; display: flex; flex-direction: column; justify-content: center; }
  .login-card h2 { margin: 10px 0 2px; font-size: 24px; color: #0f2747; }
  .login-card > .muted { margin: 0 0 22px; }
  .card-logo { display: none; width: 72px; height: 72px; }
  .field { position: relative; margin-bottom: 16px; }
  .field input { margin: 0; padding: 20px 40px 6px 14px; height: 52px; border-radius: 10px; border: 1.5px solid #e5e7eb; background: #fafafa; transition: border-color .2s, box-shadow .2s, background .2s; }
  .field input:hover { border-color: #d1d5db; }
  .field input:focus { outline: none; border-color: var(--primary-2); background: #fff; box-shadow: 0 0 0 4px rgba(30,58,95,.12); }
  .field label { position: absolute; left: 15px; top: 16px; color: #9ca3af; font-size: 14px; pointer-events: none; transition: all .18s ease; }
  .field input:focus + label, .field input:not(:placeholder-shown) + label { top: 7px; font-size: 11px; color: var(--primary-2); font-weight: 600; letter-spacing: .3px; }
  .f-ico, .eye { position: absolute; right: 12px; top: 15px; color: #9ca3af; font-size: 15px; }
  .eye { border: 0; background: none; cursor: pointer; padding: 0 2px; opacity: .55; transition: opacity .2s; }
  .eye:hover, .eye.on { opacity: 1; }
  .caps { color: var(--amber); font-size: 12px; margin: -8px 0 10px; }
  .btn.primary.login-btn { position: relative; height: 48px; font-size: 15px; font-weight: 600; border-radius: 10px; margin-top: 4px; justify-content: center;
    background: #0f2747; border: 0; box-shadow: 0 6px 16px rgba(15,39,71,.3); transition: transform .15s, box-shadow .2s, filter .2s; }
  .btn.primary.login-btn:hover { background: #1e3a5f; filter: none; transform: translateY(-1px); box-shadow: 0 10px 22px rgba(15,39,71,.35); }
  .login-btn:active { transform: translateY(1px); }
  .btn-spin { display: none; width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  .login-btn.busy .btn-txt { display: none; } .login-btn.busy .btn-spin { display: inline-block; }
  .login-btn:disabled { opacity: .85; cursor: wait; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .shake { animation: shake .45s; }
  @keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
  .center { text-align: center; } .secure { margin: 18px 0 0; }
  @media (max-width: 760px) {
    .login-panel { grid-template-columns: minmax(0,1fr); max-width: 420px; }
    .login-hero { display: none; }
    .card-logo { display: block; margin: 0 auto; }
    .login-card { padding: 32px 24px; text-align: center; }
    .field, .login-card .alert, .caps { text-align: left; }
  }

  /* Brand logo */
  .brand-logo { width: 40px; height: 40px; flex: none; display: inline-flex; align-items: center; justify-content: center; }
  .brand-logo svg { width: 100%; height: 100%; }
  .brand-logo img { height: 38px; max-width: 64px; object-fit: contain; background: #fff; border-radius: 6px; padding: 2px; }
  .grs-logo svg { width: 100%; height: 100%; display: block; }

  /* Interactions */
  .page { animation: fadein .3s ease both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card, .stat { transition: box-shadow .2s, transform .2s; }
  .stat:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.08); }
  .btn { transition: background .15s, border-color .15s, transform .1s, box-shadow .15s; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .room { transition: transform .15s, box-shadow .15s; }
  .modal { animation: rise .25s ease both; }

  /* Shell */
  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: 230px; background: #0f2747; color: #fff; display: flex; flex-direction: column; position: fixed; inset: 0 auto 0 0; z-index: 30; transition: transform .2s; }
  .brand { display: flex; gap: 10px; align-items: center; padding: 16px; font-weight: 700; font-size: 18px; font-family: Georgia, serif; color: #fff; letter-spacing: .5px; border-bottom: 1px solid rgba(255,255,255,.1); }
  #nav { flex: 1; padding: 10px 8px; overflow-y: auto; }
  #nav a { display: flex; gap: 10px; align-items: center; color: #cbd5e1; padding: 9px 12px; border-radius: 8px; margin-bottom: 2px; text-decoration: none; transition: background .15s, color .15s, padding-left .15s; }
  #nav a:hover { background: rgba(255,255,255,.07); color: #fff; padding-left: 16px; }
  #nav a.active { background: var(--gold-soft); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 var(--gold); }
  #nav .sep { font-size: 11px; text-transform: uppercase; color: var(--gold); padding: 12px 12px 4px; letter-spacing: .5px; }
  .side-foot { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.1); }
  .side-foot .muted { color: #94a3b8; } .me { font-weight: 600; }
  .side-foot .btn.ghost { color: #e2e8f0; border-color: rgba(255,255,255,.25); } .side-foot .btn.ghost:hover { background: rgba(255,255,255,.08); }
  .main { flex: 1; margin-left: 230px; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .topbar h1 { font-size: 19px; margin: 0; flex: 1; }
  .btn.menu-btn { display: none; }
  .page { padding: 22px 24px 60px; }

  /* Cards & grid */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 18px; }
  .card h3 { margin: 0 0 12px; font-size: 15px; }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .stat { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .stat .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  .stat .val { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .stat .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .bar { height: 8px; background: var(--gray-bg); border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; background: var(--accent); }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; }
  table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--border); background: #fafbfc; white-space: nowrap; }
  table.t td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.t tr:hover td { background: #fafbfd; }
  table.t tfoot td { font-weight: 700; background: #fafbfc; }
  .empty { text-align: center; color: var(--muted); padding: 28px !important; }

  /* Badges */
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; text-transform: capitalize; white-space: nowrap; }
  .b-green { background: var(--green-bg); color: var(--green); } .b-red { background: var(--red-bg); color: var(--red); }
  .b-amber { background: var(--amber-bg); color: var(--amber); } .b-blue { background: var(--blue-bg); color: var(--blue); }
  .b-gray { background: var(--gray-bg); color: #4b5563; }

  /* Buttons & forms */
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: #fff; color: var(--text);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .btn:hover { background: #f9fafb; } .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; } .btn.primary:hover { background: var(--primary-2); }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.success { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.danger { color: var(--red); border-color: #fecaca; } .btn.danger:hover { background: var(--red-bg); }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 5px 10px; font-size: 12px; } .btn.block { width: 100%; justify-content: center; margin-top: 8px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 12px; }
  input, select, textarea { width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; color: var(--text); }
  input:focus, select:focus, textarea:focus { outline: 2px solid #93c5fd; border-color: #60a5fa; }
  textarea { min-height: 70px; resize: vertical; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
  .filters label { margin: 0; min-width: 150px; }
  .alert { padding: 10px 12px; border-radius: 8px; margin: 8px 0; font-size: 13px; }
  .alert.error { background: var(--red-bg); color: var(--red); } .alert.info { background: var(--blue-bg); color: #1e40af; }
  .alert.warn { background: var(--amber-bg); color: var(--amber); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; flex-wrap: wrap; }
  .tabs a { padding: 9px 14px; color: var(--muted); border-bottom: 2px solid transparent; text-decoration: none; }
  .tabs a.active { color: var(--primary); border-color: var(--primary); font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 7px 12px; cursor: pointer; } .seg button.on { background: var(--primary); color: #fff; }
  dl.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; margin: 0; } dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; font-weight: 500; }

  /* Room board */
  .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .room { background: #fff; border: 1px solid var(--border); border-left: 5px solid var(--green); border-radius: 10px; padding: 12px; cursor: pointer; box-shadow: var(--shadow); }
  .room:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .room.occupied { border-left-color: var(--red); } .room.maintenance { border-left-color: #6b7280; } .room.cleaning { border-left-color: var(--accent); }
  .room .no { font-size: 20px; font-weight: 700; }

  /* Modal / toast / loader */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 40px 12px; overflow-y: auto; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 640px; box-shadow: 0 25px 50px rgba(0,0,0,.25); }
  .modal.wide { max-width: 860px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { margin: 0; font-size: 16px; }
  #modal-body { padding: 18px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #111827; color: #fff; padding: 12px 18px; border-radius: 10px; z-index: 70; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,.2); }
  .toast.err { background: var(--red); }
  .loader { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 80; background: transparent; }
  .loader .spinner { height: 3px; width: 40%; background: var(--accent); animation: slide 1s infinite ease-in-out; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .items-table input, .items-table select { margin: 0; padding: 6px 8px; }
  .totals-box { margin-left: auto; max-width: 340px; } .totals-box .row { justify-content: space-between; padding: 4px 0; }
  .totals-box .grand { font-size: 17px; font-weight: 700; border-top: 2px solid var(--primary); margin-top: 6px; padding-top: 8px; color: var(--primary); }
  .img-prev { height: 110px; border: 1px dashed #cbd5e1; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #f8fafc; padding: 8px; }
  .img-prev img { max-height: 100%; max-width: 100%; object-fit: contain; }
  .feed { list-style: none; margin: 0; padding: 0; } .feed li { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }

  @media (max-width: 1000px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 760px) {
    .sidebar { transform: translateX(-100%); } .sidebar.open { transform: none; }
    .main { margin-left: 0; } .btn.menu-btn { display: inline-flex; }
    .g2, .g3, .g4 { grid-template-columns: minmax(0, 1fr); }
    .page { padding: 16px; } .topbar { padding: 12px 16px; } .topbar h1 { font-size: 17px; }
    dl.kv { grid-template-columns: 110px 1fr; }
  }
  @media (max-width: 480px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
</style>
