<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('Styles'); ?>
</head>
<body>
  <!-- Login -->
  <div id="login-view" class="login-wrap hidden">
    <form id="login-form" class="login-card">
      <div class="brand-big">🏨</div>
      <h2>Hotel Management</h2>
      <p class="muted">Sign in to continue</p>
      <label>Email<input name="email" type="email" required autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <div id="login-error" class="alert error hidden"></div>
      <button class="btn primary block" type="submit">Sign in</button>
    </form>
  </div>

  <!-- App shell -->
  <div id="app-view" class="shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><span>🏨</span><span id="hotel-name">Hotel</span></div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <div id="me-name" class="me"></div>
        <div id="me-role" class="muted small"></div>
        <div class="row gap-s" style="margin-top:8px">
          <button class="btn ghost sm" onclick="go('#profile')">Password</button>
          <button class="btn ghost sm" onclick="logout()">Logout</button>
        </div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn ghost sm menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <h1 id="page-title">Dashboard</h1>
        <div id="page-actions" class="row gap-s"></div>
      </header>
      <section id="page" class="page"></section>
    </div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden" onclick="if(event.target===this)closeModal()">
    <div class="modal"><div class="modal-head"><h3 id="modal-title"></h3><button class="btn ghost sm" onclick="closeModal()">✕</button></div><div id="modal-body"></div></div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div id="loader" class="loader hidden"><div class="spinner"></div></div>
